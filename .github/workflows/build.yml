name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
          pip install --upgrade buildozer "cython<3.0.0"
      
      - name: Setup Android SDK for Buildozer
        run: |
          # Видаляємо системні змінні
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
          
          # Створюємо структуру папок, яку очікує buildozer
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILD_SDK"/{build-tools,platforms,platform-tools,tools,licenses}
          
          # Завантажуємо sdkmanager
          cd "$BUILD_SDK"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          
          # Приймаємо ліцензії
          yes | ./cmdline-tools/bin/sdkmanager --sdk_root="$BUILD_SDK" --licenses
          
          # Встановлюємо build-tools (які містять aidl)
          ./cmdline-tools/bin/sdkmanager --sdk_root="$BUILD_SDK" "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          
          # Перевіряємо, що aidl тепер є
          ls -la "$BUILD_SDK/build-tools/34.0.0/aidl"
      
      - name: Build APK
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
          
          cat > buildozer.spec << 'EOF'
          [app]
          title = Leaf Area Meter
          package.name = leafareameter
          package.domain = org.example
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3, kivy==2.3.0, camera4kivy, gestalt, numpy, opencv-python-headless
          orientation = portrait
          android.permissions = CAMERA, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          android.api = 34
          android.minapi = 24
          android.ndk = 25b
          android.features = android.hardware.camera, android.hardware.camera.autofocus
          EOF
          
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROIDAPI=34
          export ANDROIDMINAPI=24
          
          buildozer -v android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leaf-apk
          path: bin/*.apk
