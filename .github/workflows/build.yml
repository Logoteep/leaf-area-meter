name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
      
      - name: Install Android SDK tools
        run: |
          sudo apt install -y android-sdk-build-tools android-sdk-platform-tools
          # Альтернативно встановлюємо через sdkmanager
          if [ ! -d "$HOME/Android/Sdk" ]; then
            mkdir -p $HOME/Android/Sdk
            cd $HOME/Android/Sdk
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip commandlinetools-linux-11076708_latest.zip
            yes | ./cmdline-tools/bin/sdkmanager --sdk_root=$HOME/Android/Sdk "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          fi
      
      - name: Install Buildozer
        run: |
          pip install --upgrade buildozer "cython<3.0.0"
      
      - name: Configure Buildozer
        run: |
          buildozer init
          sed -i 's/^requirements =.*/requirements = python3, kivy==2.3.0, camera4kivy, gestalt, numpy, opencv-python-headless/' buildozer.spec
          sed -i 's/^android.permissions =.*/android.permissions = CAMERA, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE/' buildozer.spec
          sed -i 's/^android.api =.*/android.api = 34/' buildozer.spec
          sed -i 's/^android.minapi =.*/android.minapi = 24/' buildozer.spec
          sed -i 's/^android.ndk =.*/android.ndk = 25b/' buildozer.spec
          echo "android.features = android.hardware.camera, android.hardware.camera.autofocus" >> buildozer.spec
      
      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/build-tools/34.0.0
          buildozer -v android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leaf-apk
          path: bin/*.apk
