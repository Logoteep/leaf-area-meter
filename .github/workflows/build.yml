name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
          pip install --upgrade buildozer "cython<3.0.0"
      
      - name: Setup Android SDK properly
        run: |
          # Видаляємо системні змінні
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
          
          # Шлях до SDK Buildozer
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"
          cd "$SDK_DIR"
          
          # Завантажуємо command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          
          # СТВОРЮЄМО СИМВОЛІЧНЕ ПОСИЛАННЯ - це ключовий момент!
          # Buildozer шукає sdkmanager в tools/bin/
          mkdir -p tools
          ln -sf "$SDK_DIR/cmdline-tools/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          ln -sf "$SDK_DIR/cmdline-tools/bin/avdmanager" "$SDK_DIR/tools/bin/avdmanager"
          
          # Приймаємо ліцензії
          yes | ./cmdline-tools/bin/sdkmanager --sdk_root="$SDK_DIR" --licenses
          
          # Встановлюємо потрібні компоненти
          ./cmdline-tools/bin/sdkmanager --sdk_root="$SDK_DIR" "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          
          # ПЕРЕВІРКА: чи є aidl
          echo "Checking for aidl:"
          ls -la "$SDK_DIR/build-tools/34.0.0/aidl"
          
          # ПЕРЕВІРКА: чи є sdkmanager за шляхом buildozer
          echo "Checking for sdkmanager:"
          ls -la "$SDK_DIR/tools/bin/sdkmanager"
      
      - name: Build APK
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT
          
          cat > buildozer.spec << 'EOF'
          [app]
          title = Leaf Area Meter
          package.name = leafareameter
          package.domain = org.example
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3, kivy==2.3.0, camera4kivy, gestalt, numpy, opencv-python-headless
          orientation = portrait
          android.permissions = CAMERA, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          android.api = 34
          android.minapi = 24
          android.ndk = 25b
          android.features = android.hardware.camera, android.hardware.camera.autofocus
          EOF
          
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROIDAPI=34
          export ANDROIDMINAPI=24
          
          buildozer -v android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leaf-apk
          path: bin/*.apk
