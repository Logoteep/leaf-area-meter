name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
          pip install --upgrade buildozer "cython<3.0.0"
      
      - name: Build APK
        run: |
          # Видаляємо системні змінні Android, щоб buildozer використовував свій SDK
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          
          cat > buildozer.spec << 'EOF'
          [app]
          title = Leaf Area Meter
          package.name = leafareameter
          package.domain = org.example
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3, kivy==2.3.0, camera4kivy, gestalt, numpy, opencv-python-headless
          orientation = portrait
          android.permissions = CAMERA, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
          android.api = 34
          android.minapi = 24
          android.ndk = 25b
          android.features = android.hardware.camera, android.hardware.camera.autofocus
          EOF
          
          buildozer -v android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leaf-apk
          path: bin/*.apk
